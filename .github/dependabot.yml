version: 2
updates:
  - package-ecosystem: "npm" # Dependabot detects pnpm-lock.yaml under this ecosystem; there is no separate "pnpm" value
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
